<svg viewBox="0 0 240 135" width="720" height="405" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <title>CPEnvPro dashboard mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#2b0a3d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="135" fill="url(#bg)"/>
  <rect x="0" y="0" width="240" height="135" fill="none" stroke="#2a2a2e" stroke-width="3"/>

  <!-- header -->
  <line x1="0" y1="13" x2="240" y2="13" stroke="#39ffe0" stroke-width="1"/>
  <text x="4" y="10" font-size="9" fill="#39ffe0">ENV-PRO</text>
  <rect x="216" y="3" width="14" height="7" fill="none" stroke="#39ffe0" stroke-width="1"/>
  <rect x="230" y="5" width="2" height="3" fill="#39ffe0"/>
  <rect x="217" y="4" width="11" height="5" fill="#39ffe0"/>
  <text x="212" y="10" font-size="9" fill="#39ffe0" text-anchor="end">78%</text>

  <!-- ring gauges: TEMP / HUM / PRESS -->
  <g stroke-linecap="round" fill="none">
    <!-- TEMP -->
    <circle cx="40" cy="57" r="31" stroke="#3a2a55" stroke-width="8"/>
    <circle cx="40" cy="57" r="31" stroke="#39ffe0" stroke-width="8"
            stroke-dasharray="194.8" stroke-dashoffset="101.3" transform="rotate(-90 40 57)"/>
    <!-- HUM -->
    <circle cx="120" cy="57" r="31" stroke="#3a2a55" stroke-width="8"/>
    <circle cx="120" cy="57" r="31" stroke="#ff3ea5" stroke-width="8"
            stroke-dasharray="194.8" stroke-dashoffset="105.2" transform="rotate(-90 120 57)"/>
    <!-- PRESS -->
    <circle cx="200" cy="57" r="31" stroke="#3a2a55" stroke-width="8"/>
    <circle cx="200" cy="57" r="31" stroke="#b06bff" stroke-width="8"
            stroke-dasharray="194.8" stroke-dashoffset="72.1" transform="rotate(-90 200 57)"/>
  </g>
  <g text-anchor="middle">
    <text x="40" y="55" font-size="9" fill="#ffffff">24.6C</text>
    <text x="40" y="68" font-size="7" fill="#8fd8cf">TEMP</text>
    <text x="120" y="55" font-size="9" fill="#ffffff">46%</text>
    <text x="120" y="68" font-size="7" fill="#8fd8cf">HUM</text>
    <text x="200" y="55" font-size="9" fill="#ffffff">1013</text>
    <text x="200" y="68" font-size="7" fill="#8fd8cf">PRESS</text>
  </g>

  <line x1="0" y1="100" x2="240" y2="100" stroke="#3a2a55" stroke-width="1"/>

  <!-- mini stats: VOC / CO2eq / IAQ -->
  <g text-anchor="middle">
    <text x="40" y="106" font-size="6.5" fill="#39ffe0">VOC</text>
    <text x="40" y="115" font-size="8" fill="#ffffff">120k</text>
    <rect x="10" y="120" width="60" height="3" fill="#3a2a55"/>
    <rect x="10" y="120" width="36" height="3" fill="#39ffe0"/>

    <text x="120" y="106" font-size="6.5" fill="#ff3ea5">CO2eq</text>
    <text x="120" y="115" font-size="8" fill="#ffffff">612</text>
    <rect x="90" y="120" width="60" height="3" fill="#3a2a55"/>
    <rect x="90" y="120" width="24" height="3" fill="#ff3ea5"/>

    <text x="200" y="106" font-size="6.5" fill="#b06bff">IAQ</text>
    <text x="200" y="115" font-size="8" fill="#ffffff">42</text>
    <rect x="170" y="120" width="60" height="3" fill="#3a2a55"/>
    <rect x="170" y="120" width="18" height="3" fill="#b06bff"/>
  </g>
</svg>
